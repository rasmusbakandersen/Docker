services:
  netalertx:
    container_name: netalertx
    image: "ghcr.io/jokob-sk/netalertx:latest"
    network_mode: "host"
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      - TZ=Europe/Copenhagen
      - PORT=20211
      - GRAPHQL_PORT=20212
      - PUID=20211
      - PGID=20211
    volumes:
      - ./data:/data:z
