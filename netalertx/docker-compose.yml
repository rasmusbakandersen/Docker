services:
  netalertx:
    container_name: netalertx
    image: "ghcr.io/jokob-sk/netalertx:latest"
    network_mode: "host"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:false
    environment:
      - TZ=Europe/Copenhagen
      - PORT=20211
      - GRAPHQL_PORT=20212
      - PUID=20211
      - PGID=20211
    tmpfs:
      - /tmp/run
      - /tmp/api
      - /tmp/log
      - /tmp/nginx/active-config
    volumes:
      - ./data:/data:z
