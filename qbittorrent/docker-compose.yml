services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - CHOWN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./gluetun:/gluetun:z
    tmpfs:
      - /tmp/gluetun:noexec,nosuid,size=64m,mode=1777
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=Denmark
      - TZ=Europe/Copenhagen
    restart: always
    networks:
      - arr-network
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config:z
      - /mnt/nas-arrstack/downloads:/downloads:z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || pgrep -f qbittorrent || exit 1"]
      interval: 2m
      timeout: 20s
      retries: 2
      start_period: 60s
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
networks:
  arr-network:
    external: true
