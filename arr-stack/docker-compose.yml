services:
  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    dns:
      - 192.168.86.10
      - 1.1.1.1
    volumes:
      - ./config/prowlarr:/config:z
      - /mnt/nas-arrstack:/data:z
    restart: unless-stopped
    networks:
      - arr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696 || pgrep -f prowlarr || exit 1"]
      interval: 90s
      timeout: 15s
      retries: 2
      start_period: 45s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    volumes:
      - ./config/sonarr:/config:z
      - /mnt/nas-arrstack:/data:z
    restart: unless-stopped
    networks:
      - arr-network
    depends_on:
      - prowlarr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989 || pgrep -f sonarr || exit 1"]
      interval: 90s
      timeout: 15s
      retries: 2
      start_period: 45s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  radarr:
    image: ghcr.io/hotio/radarr:latest
    container_name: radarr
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    volumes:
      - ./config/radarr:/config:z
      - /mnt/nas-arrstack:/data:z
    restart: unless-stopped
    networks:
      - arr-network
    depends_on:
      - prowlarr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878 || pgrep -f radarr || exit 1"]
      interval: 90s
      timeout: 15s
      retries: 2
      start_period: 45s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lidarr:
    image: ghcr.io/hotio/lidarr:latest
    container_name: lidarr
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    volumes:
      - ./config/lidarr:/config:z
      - /mnt/nas-arrstack:/data:z
    restart: unless-stopped
    networks:
      - arr-network
    depends_on:
      - prowlarr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8686 || pgrep -f lidarr || exit 1"]
      interval: 90s
      timeout: 15s
      retries: 2
      start_period: 45s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:hardcover
    container_name: bookshelf
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/readarr:/config:z
      - /mnt/nas-arrstack:/data:z
    restart: unless-stopped
    networks:
      - arr-network
    depends_on:
      - prowlarr
      - rreading-glasses
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8787 || exit 1"]
      interval: 90s
      timeout: 15s
      retries: 2
      start_period: 45s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    tmpfs:
      - /tmp:noexec,nosuid,size=256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rreading-glasses:
    image: blampe/rreading-glasses:hardcover
    container_name: rreading-glasses
    hostname: rreading-glasses
    entrypoint: ["/main", "serve"]
    command:
      - --verbose
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - HARDCOVER_AUTH=${RREADING_GLASSES_HARDCOVER_AUTH}
      - POSTGRES_HOST=rreading-glasses-db
      - POSTGRES_DATABASE=rreading-glasses
      - POSTGRES_USER=rreading-glasses
      - POSTGRES_PASSWORD=${RREADING_GLASSES_DB_PASSWORD}
    restart: unless-stopped
    networks:
      - arr-network
    depends_on:
      rreading-glasses-db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rreading-glasses-db:
    image: postgres:17
    container_name: rreading-glasses-db
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=rreading-glasses
      - POSTGRES_USER=rreading-glasses
      - POSTGRES_PASSWORD=${RREADING_GLASSES_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rreading-glasses"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./config/rreading-glasses-db:/var/lib/postgresql/data:z
    restart: unless-stopped
    networks:
      - arr-network
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Copenhagen
      - LOG_LEVEL=debug
      - PORT=5055
    dns:
      - 192.168.86.10
      - 1.1.1.1
    volumes:
      - ./config/seerr:/app/config:z
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr
    networks:
      - arr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5055 || pgrep -f serr || exit 1"]
      interval: 90s
      timeout: 15s
      retries: 2
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Copenhagen
    volumes:
      - ./config/bazarr:/config:z
      - /mnt/nas-arrstack/movies:/movies:z
      - /mnt/nas-arrstack/tv:/tv:z
    restart: unless-stopped
    networks:
      - arr-network
    depends_on:
      - sonarr
      - radarr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767 || pgrep -f bazarr || exit 1"]
      interval: 2m
      timeout: 20s
      retries: 2
      start_period: 45s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 300
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arr-network:
    driver: bridge
    name: arr-network
